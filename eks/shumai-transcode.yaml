apiVersion: apps/v1
kind: Deployment
metadata:
  name: shumai-transcode
  namespace: shumai
  labels:
    app: shumai-transcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shumai-transcode
  template:
    metadata:
      labels:
        app: shumai-transcode
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/nodegroup
                    operator: In
                    values:
                      - shumai-transcode-spot
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - transcode
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: shumaione/shumai-transcode:latest
          imagePullPolicy: IfNotPresent
          env:
            # Downward API: Injects the unique pod name so DbosExecutor assigns a unique,
            # deterministic executor ID per worker replica across pod restarts.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: shumai-config
            - secretRef:
                name: shumai-secret
          resources:
            requests:
              cpu: 3000m
              memory: 4Gi
            limits:
              cpu: 3900m
              memory: 6Gi
