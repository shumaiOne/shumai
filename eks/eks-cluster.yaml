apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: shumai-eks
  region: us-east-1
  version: '1.31'

iam:
  withOIDC: true

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  # General system workload: Web UI, REST API, DBOS PostgreSQL, and Garage S3
  # Runs on On-Demand instances to guarantee database & storage durability without spot interruptions
  - name: shumai-general
    instanceType: c9g.large # 2 vCPU, 4 GiB RAM (Graviton5 On-Demand, ~$0.087/hr)
    spot: false
    minSize: 1
    maxSize: 2
    desiredCapacity: 1
    amiFamily: AmazonLinux2023
    volumeSize: 50
    volumeType: gp3
    labels:
      workload: general
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true

  # Transcoding compute pool: High-CPU media processing
  # Uses Spot instances with capacity diversification across Graviton generations
  - name: shumai-transcode-spot
    instanceTypes:
      - c9g.xlarge # 4 vCPU, 8 GiB RAM (Graviton5 Spot, ~$0.08/hr, primary)
      - c8g.xlarge # 4 vCPU, 8 GiB RAM (Graviton4 Spot, ~$0.07/hr, fallback pool)
    spot: true
    minSize: 1
    maxSize: 5
    desiredCapacity: 1
    amiFamily: AmazonLinux2023
    volumeSize: 50
    volumeType: gp3
    labels:
      workload: transcode
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
