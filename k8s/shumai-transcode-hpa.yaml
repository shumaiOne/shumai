apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shumai-transcode-hpa
  namespace: shumai
  labels:
    app: shumai-transcode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shumai-transcode
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
