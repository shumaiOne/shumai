apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: shumai
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "0.0.0.0:3901"
    rpc_secret = "c7d7e35b7501a91e5cfb3874026315579930f367fa3b7e4a1e94cf67484a86cf"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"
    root_domain = ".s3.garage"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
    admin_token = "admin-secret-token"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: shumai
  labels:
    app: garage
spec:
  ports:
    - port: 3900
      name: s3-api
    - port: 3901
      name: rpc
    - port: 3903
      name: admin
  selector:
    app: garage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: shumai
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          imagePullPolicy: IfNotPresent
          command: ['/garage', 'server']
          ports:
            - containerPort: 3900
              name: s3-api
            - containerPort: 3901
              name: rpc
            - containerPort: 3903
              name: admin
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: garage-meta
              mountPath: /var/lib/garage/meta
            - name: garage-data
              mountPath: /var/lib/garage/data
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: garage-meta
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: garage-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init
  namespace: shumai
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: garage-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: alpine:3.20
          env:
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: shumai-config
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: shumai-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: shumai-secret
                  key: S3_SECRET_ACCESS_KEY
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shumai-secret
                  key: GARAGE_ADMIN_TOKEN
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache curl jq >/dev/null 2>&1

              echo "Waiting for Garage Admin API to respond..."
              until curl -s -f -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" http://garage:3903/v2/GetClusterStatus >/dev/null 2>&1; do
                sleep 2
              done

              echo "Garage Admin API is online. Retrieving cluster status..."
              STATUS=$(curl -s -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" http://garage:3903/v2/GetClusterStatus)
              NODE_ID=$(echo "$STATUS" | jq -r '.nodes[0].id // empty')
              if [ -z "$NODE_ID" ]; then
                echo "Error: Node ID not found"
                exit 1
              fi
              echo "Discovered Node ID: $NODE_ID"

              ROLE=$(echo "$STATUS" | jq -r '.nodes[0].role // empty')
              if [ -z "$ROLE" ] || [ "$ROLE" = "null" ]; then
                echo "Assigning layout role to node..."
                curl -s -f -X POST http://garage:3903/v2/UpdateClusterLayout \
                  -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"roles\": [{\"id\": \"$NODE_ID\", \"zone\": \"dc1\", \"capacity\": 10737418240, \"tags\": []}]}" >/dev/null

                echo "Applying cluster layout (version 1)..."
                curl -s -f -X POST http://garage:3903/v2/ApplyClusterLayout \
                  -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{"version": 1}' >/dev/null || true
              fi

              echo "Importing S3 Access Key..."
              curl -s -f -X POST http://garage:3903/v2/ImportKey \
                -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"shumai-key\", \"accessKeyId\": \"${S3_ACCESS_KEY_ID}\", \"secretAccessKey\": \"${S3_SECRET_ACCESS_KEY}\"}" >/dev/null || true

              echo "Creating S3 bucket '${S3_BUCKET}'..."
              BUCKET_RESP=$(curl -s -X POST http://garage:3903/v2/CreateBucket \
                -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"globalAlias\": \"${S3_BUCKET}\"}")
              echo "$BUCKET_RESP"

              BUCKET_ID=$(echo "$BUCKET_RESP" | jq -r '.id // empty')
              if [ -z "$BUCKET_ID" ]; then
                # Fetch existing bucket ID if already created
                BUCKET_ID=$(curl -s -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" "http://garage:3903/v2/GetBucketInfo?globalAlias=${S3_BUCKET}" | jq -r '.id // empty')
              fi

              if [ -n "$BUCKET_ID" ]; then
                echo "Granting bucket permissions for key on bucket ID $BUCKET_ID..."
                curl -s -f -X POST http://garage:3903/v2/AllowBucketKey \
                  -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"bucketId\": \"${BUCKET_ID}\", \"accessKeyId\": \"${S3_ACCESS_KEY_ID}\", \"permissions\": {\"read\": true, \"write\": true, \"owner\": true}}" >/dev/null || true
              fi

              echo "✅ Garage S3 storage cluster initialized successfully!"
